configuration:
  known_devices:
    name: Known devices
    description: >-
      Optional. Names of the devices you bind to this Tang server, as your router reports them (for example
      server.lan). You can also mark devices as known from the dashboard. Requests from any other device are
      marked unknown. Known is a label for the history, not a security check. Changes apply within about a
      minute, with no restart.
  address_reserved:
    name: Address reserved
    description: >-
      Turn on once you have reserved this Home Assistant machine's IP address in your router. The dashboard's Mark as reserved
      button sets this for you. Hides the reservation reminder.
network:
  7500/tcp: Tang (home network only)
