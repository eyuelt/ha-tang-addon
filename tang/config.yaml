name: Tang
version: "0.1.0"
slug: tang
description: Tang server for network-bound LUKS disk unlock (Clevis), with a request log and dashboard
url: https://github.com/eyuelt/ha-tang-addon
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lock-network
panel_title: Tang
homeassistant_api: true
hassio_api: true
ports:
  7500/tcp: 7500
ports_description:
  7500/tcp: "Tang (home network only)"
options:
  known_devices: []
  address_reserved: false
schema:
  known_devices:
    - str
  address_reserved: bool
